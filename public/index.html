<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parcely okresu Jičín</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
          integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<div class="controls">
    <form id="search" class="panel search" autocomplete="off">
        <h2>Hledat parcelu</h2>
        <label for="search-area">Katastrální území</label>
        <input id="search-area" list="cadastral-areas" placeholder="např. Jičín" required>
        <datalist id="cadastral-areas"></datalist>
        <label for="search-number">Číslo parcely</label>
        <input id="search-number" placeholder="např. st. 1 nebo 791/34" required>
        <button type="submit">Najít</button>
        <p id="search-status" class="status-error" hidden></p>
    </form>
    <aside class="panel legend">
        <h2>Druh pozemku</h2>
        <ul id="legend-items"></ul>
        <p id="zoom-hint" class="hint">Přibližte mapu pro zobrazení parcel</p>
    </aside>
</div>
<aside id="detail" class="detail" aria-live="polite" hidden>
    <button type="button" id="detail-close" class="close" aria-label="Zavřít">&times;</button>
    <div id="detail-content"></div>
</aside>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
        integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
