name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Composer audit, PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, iconv, libxml, pcntl, pdo_pgsql, xmlreader, zip, zlib
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: vendor/bin/phpunit
